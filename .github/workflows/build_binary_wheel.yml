name: Build Binary Wheel (Windows)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master

jobs:
  build_wheels:
    name: Build wheel on Windows - Python ${{ matrix.python-version }} - CUDA ${{ matrix.cuda-version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
        cuda-version: ['11.8.0', '12.1.1']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.11
        with:
          cuda: ${{ matrix.cuda-version }}
          method: 'network'

      - name: Install PyTorch with CUDA 11.8
        if: matrix.cuda-version == '11.8.0'
        run: |
          pip install torch==2.2.2+cu118 torchvision==0.17.2+cu118 --extra-index-url https://download.pytorch.org/whl/cu118

      - name: Install PyTorch with CUDA 12.1
        if: matrix.cuda-version == '12.1.1'
        run: |
          pip install torch==2.2.2+cu121 torchvision==0.17.2+cu121 --extra-index-url https://download.pytorch.org/whl/cu121

      - name: Install build dependencies
        run: |
          pip install wheel setuptools ninja build

      - name: Build wheel
        run: |
          python -m build --wheel
        env:
          CUDA_HOME: ${{ env.CUDA_PATH }}
          TORCH_CUDA_ARCH_LIST: "6.0;6.1;7.0;7.5;8.0;8.6;8.9;9.0"

      - name: Install wheel for testing
        run: |
          pip install dist/*.whl

      - name: Test installation
        run: |
          python -c "import diff_gaussian_rasterization; print('diff_gaussian_rasterization imported successfully')"
          python -c "import simple_knn; print('simple_knn imported successfully')"

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-py${{ matrix.python-version }}-cuda${{ matrix.cuda-version }}
          path: dist/*.whl
          retention-days: 30
